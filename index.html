
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT TREO MESS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #090a12;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 28px 22px;
    background: #121421;
    border: 1px solid #39315c;
    border-radius: 20px;
    box-shadow: 0 0 30px #7854ff22;
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    font-size: 40px;
    margin-bottom: 10px;
}

h1 {
    color: #b7a0ff;
    font-size: 27px;
    letter-spacing: 1px;
}

.subtitle {
    color: #8b8da5;
    font-size: 12px;
    margin-top: 8px;
}

.field {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 13px;
    color: #c8c5dd;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #34364b;
    border-radius: 10px;
    outline: none;
    background: #0b0d17;
    color: white;
    font-size: 14px;
}

input:focus {
    border-color: #9875ff;
    box-shadow: 0 0 10px #9875ff22;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(100deg, #7854ff, #a855f7);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:active {
    transform: scale(.98);
}

.status {
    margin-top: 20px;
    padding: 14px;
    background: #1b1d2d;
    border-radius: 10px;
    border: 1px solid #34364b;
}

.status-title {
    color: #b7a0ff;
    font-size: 13px;
    margin-bottom: 8px;
}

#statusText {
    color: #b8bacb;
    font-size: 12px;
    line-height: 1.6;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #686b82;
    font-size: 11px;
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <div class="logo">💬</div>
        <h1>BOT TREO MESS</h1>
        <p class="subtitle">MESSAGE CONTROL PANEL</p>
    </div>

    <div class="field">
        <label>01 — NHẬP COOKIE FACEBOOK</label>
        <input
            type="password"
            id="cookie"
            placeholder="Dữ liệu thử nghiệm..."
            autocomplete="off"
        >
        <p style="font-size:11px;color:#85879b;margin-top:7px">
            Không nhập cookie đăng nhập thật.
        </p>
    </div>

    <div class="field">
        <label>02 — NHẬP ID BOX MESSAGE</label>
        <input
            type="text"
            id="boxId"
            placeholder="Nhập ID box..."
        >
    </div>

    <div class="field">
        <label>03 — NHẬP DELAY (GIÂY)</label>
        <input
            type="number"
            id="delay"
            value="5"
            min="1"
            placeholder="5"
        >
    </div>

    <button onclick="startBot()">
        ▶ BẮT ĐẦU CHẠY
    </button>

    <div class="status">
        <div class="status-title">● TRẠNG THÁI HỆ THỐNG</div>
        <p id="statusText">Hệ thống đang chờ thao tác...</p>
    </div>

    <div class="footer">
        BOT TREO MESS © 2026
        <br>Giao diện thử nghiệm
    </div>

</div>

<script>
function startBot() {
    const boxId = document.getElementById("boxId").value.trim();
    const delay = Number(document.getElementById("delay").value);
    const status = document.getElementById("statusText");

    if (!boxId) {
        status.textContent = "Vui lòng nhập ID box message.";
        return;
    }

    if (!Number.isFinite(delay) || delay < 1) {
        status.textContent = "Delay phải là số giây từ 1 trở lên.";
        return;
    }

    status.textContent =
        "Đã kiểm tra dữ liệu giao diện. " +
        "ID box: " + boxId +
        " | Delay: " + delay +
        " giây. Chưa kết nối bot hoặc gửi tin nhắn.";
}
</script>
</body>
          </html>
